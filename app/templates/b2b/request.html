{% extends "base.html" %}

{% block title %}Request B2B Contract - AgriMarket{% endblock %}

{% block content %}
<h2 class="mb-4">Request Bulk Order Contract</h2>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Select Product</label>
                        <select name="product_id" class="form-select" required>
                            <option value="">Choose a product...</option>
                            {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }} - {{ product.farmer.name }} ({{ product.bulk_price|currency }}/{{ product.unit }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Proposed Price per Unit (₹)</label>
                        <input type="number" name="price" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Total Volume</label>
                        <input type="number" name="volume" class="form-control" step="0.1" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Delivery Schedule</label>
                        <textarea name="schedule" class="form-control" rows="3" placeholder="Describe delivery schedule..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Submit Request</button>
                    <a href="{{ url_for('b2b.contracts') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
